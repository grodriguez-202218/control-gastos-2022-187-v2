<div class="mercury-wrapper">
  <div class="auth-split">
    <div class="form-panel">
      <header class="header">
        <h1>ACCESO A<br />CONTROL DE<br /><span class="accent-text">AUREO LUNAS</span></h1>
        <p class="subtitle">Ingresar credenciales para poder acceder</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" formControlName="email" placeholder="tu@email.com" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••" required />
          <button type="button" class="toggle-visibility" (click)="togglePasswordVisibility()">
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>

        <p *ngIf="sessionMessage" class="status-msg">{{ sessionMessage }}</p>
        <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

        <button type="submit" class="btn-base">Iniciar Sesión</button>
      </form>

      <footer class="footer-nav">
        <a routerLink="/register">¿No tienes cuenta? Regístrate</a>
      </footer>
    </div>

    <div class="image-panel">
      <div class="stage">
        <div
          *ngFor="let blob of blobsData"
          #blobRef
          class="blob"
          [style.width.px]="blob.size"
          [style.height.px]="blob.size"
          [style.left.%]="blob.left"
          [style.top.%]="blob.top"
          [style.animation-delay.s]="blob.animationDelay"
          [style.animation-duration.s]="blob.animationDuration"
        ></div>
      </div>
      <img src="/images/login-hero.jfif" alt="Control de gastos" class="hero-image" />
    </div>
  </div>
</div>
