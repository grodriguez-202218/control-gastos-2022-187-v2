<div class="mercury-wrapper">
  <div class="auth-split">
    <div class="form-panel">
      <header class="header">
        <h1>CREAR<br />CUENTA<br /><span class="accent-text">PARA AUREO LUNAS</span></h1>
        <p class="subtitle">Regístrate para empezar a gestionar tus gastos</p>
      </header>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="form-group">
          <label for="fullName">Nombre Completo</label>
          <input id="fullName" type="text" formControlName="fullName" placeholder="Ej. Juan Pérez" required />
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" formControlName="email" placeholder="correo@ejemplo.com" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••" required />
          <button type="button" class="toggle-visibility" (click)="togglePasswordVisibility()">
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input id="confirmPassword" [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirmPassword" placeholder="••••••••" required />
          <button type="button" class="toggle-visibility" (click)="toggleConfirmPasswordVisibility()">
            {{ showConfirmPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>

        <div class="form-group">
          <label>Rol</label>
          <div class="role-buttons">
            <button
              type="button"
              class="role-btn"
              [class.active]="registerForm.get('role')?.value === 'user'"
              (click)="setRole('user')">
              Usuario
            </button>
            <button
              type="button"
              class="role-btn"
              [class.active]="registerForm.get('role')?.value === 'admin'"
              (click)="setRole('admin')">
              Admin
            </button>
          </div>
        </div>

        <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

        <button type="submit" class="btn-base">Registrarse</button>
      </form>

      <footer class="footer-nav">
        <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
      </footer>
    </div>

    <div class="image-panel">
      <div class="stage">
        <div
          *ngFor="let blob of blobsData"
          #blobRef
          class="blob"
          [style.width.px]="blob.size"
          [style.height.px]="blob.size"
          [style.left.%]="blob.left"
          [style.top.%]="blob.top"
          [style.animation-delay.s]="blob.animationDelay"
          [style.animation-duration.s]="blob.animationDuration"
        ></div>
      </div>
      <img src="/images/login-badge.jfif" alt="Control de gastos" class="hero-image" />
    </div>
  </div>
</div>
